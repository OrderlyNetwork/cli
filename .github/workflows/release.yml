name: release

# Cut a release by pushing a tag that matches Cargo.toml, e.g. for 2.0.0:
#   git tag v2.0.0 && git push origin v2.0.0
#
# Every asset is:
#   * checksummed (SHA256SUMS),
#   * signed keylessly with cosign (Sigstore, GitHub OIDC, Rekor transparency log),
#   * attested with GitHub build provenance (binds the digest to this workflow
#     run and the tagged commit).
#
# A manual run (workflow_dispatch) builds and attests the same matrix but does
# not publish a release, so the pipeline can be exercised without a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: orderly

jobs:
  # A tag can point at any commit, so gate publishing on a green test run of
  # the exact tagged tree.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: ${{ matrix.target }}
    needs: preflight
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target, so nothing is cross-compiled.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Point musl targets at musl-gcc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target="${{ matrix.target }}"
          upper="${target^^}"
          upper="${upper//-/_}"
          echo "CARGO_TARGET_${upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          # ring (pulled in by rustls) compiles C; make plain `cc` point at musl.
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN" dist/
          tar -C dist -czf "dist/$BIN-${{ matrix.target }}.tar.gz" "$BIN"
          rm "dist/$BIN"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" dist/
          Compress-Archive -Path "dist/$env:BIN.exe" -DestinationPath "dist/$env:BIN-${{ matrix.target }}.zip"
          Remove-Item "dist/$env:BIN.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # cosign keyless signing + provenance attestation
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Only for Cargo.lock (recorded in BUILD-INFO.txt); assets come from the
      # build jobs.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Sign and attest once, on Linux. The artifacts are platform-independent
      # blobs; cosign links the digest to this workflow run and tag. Doing it
      # here avoids needing a cosign binary on every runner (notably
      # windows-11-arm, which cosign-installer does not support).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archives (keyless)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "nothing to sign"; exit 1; }
          for f in "${files[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Build info
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "name: orderly"
            echo "tag: $TAG"
            echo "commit: $COMMIT"
            echo "workflow: $RUN_URL"
            echo "cargo-lock-sha256: $(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "targets:"
            ls dist | sed -n 's/^orderly-\(.*\)\.\(tar\.gz\|zip\)$/  - \1/p'
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --generate-notes "${extra[@]}"
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false

  # Reads the assets back from the published release and verifies them, so a
  # broken signature or missing attestation fails the workflow.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$GH_REPO" --dir dl
          ls -l dl

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify checksums
        working-directory: dl
        run: sha256sum -c SHA256SUMS

      - name: Verify build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh attestation verify dl/orderly-x86_64-unknown-linux-musl.tar.gz \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify cosign signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dl/orderly-x86_64-unknown-linux-musl.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dl/orderly-x86_64-unknown-linux-musl.tar.gz
