# GitLab is the canonical repository and publishes the WASM package to npm.
# GitHub remains the binary release target; matching vX.Y.Z tags are mirrored.
#
# Required CI/CD variables (group or project):
#   PUBLIC_NPM_REGISTRY, PUBLIC_NPM_TOKEN, GIT_USERNAME, GIT_TOKEN
#   GITHUB_MIRROR_TOKEN (PAT with contents:write on OrderlyNetwork/cli)
# Optional:
#   INTERNAL_NPM_REGISTRY, INTERNAL_NPM_TOKEN, SLACK_WEBHOOK_URL
include:
  - project: "orderlynetwork/orderly-fe/common-ci"
    ref: main
    file: "/npm-release.yaml"

variables:
  GIT_DEPTH: "0"

verify:
  stage: release
  image:
    name: node:22.23.4
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^npm\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm install -g "pnpm@${PNPM_VERSION:-12}"
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm verify:artifacts
    - npm pack --dry-run
  tags:
    - dev
    - build

verify_wasm:
  stage: release
  image:
    name: node:22.23.4
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^npm\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential curl
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
    - . "$HOME/.cargo/env"
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-bindgen-cli --version 0.2.130 --locked
    - npm install -g "pnpm@${PNPM_VERSION:-12}"
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - pnpm test
    - git diff --exit-code -- wasm/source-hash.txt dist
  tags:
    - dev
    - build

npm_patch_alpha:
  needs: [verify, verify_wasm]

npm_patch_stable:
  needs: [verify, verify_wasm]

npm_minor_alpha:
  needs: [verify, verify_wasm]

npm_minor_stable:
  needs: [verify, verify_wasm]

npm_major_alpha:
  needs: [verify, verify_wasm]

npm_major_stable:
  needs: [verify, verify_wasm]

# The shared npm-release template bumps package.json, runs `npm version`
# (which syncs Cargo.toml/Cargo.lock), tags vX.Y.Z, and publishes npm.
# Mirror only the tag; GitHub Actions builds the CLI binary from it.
mirror_github_tag:
  stage: release
  image:
    name: node:22.23.4
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -n "$GITHUB_MIRROR_TOKEN"
    - git fetch --tags origin
    - git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/OrderlyNetwork/cli.git" "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
  tags:
    - dev
    - build

# Publishes the six released binaries as npm platform packages
# (@orderly.network/cli-<os>-<cpu>), which is how consumers such as the trading
# MCP get the CLI without a separate install.
#
# Runs here rather than in GitHub Actions because the npm token lives in GitLab
# CI. GitHub still builds, signs and publishes the archives; this job downloads
# the release assets for the tag and republishes them to npm.
#
# Manual: start it after the GitHub release for the tag exists. The curl
# retries cover the gap while GitHub Actions builds. Run it from the tag
# pipeline, or from `main` with PLATFORM_TAG set to bootstrap an older release
# whose tag predates this job.
npm_platforms:
  stage: release
  image:
    name: node:22.23.4
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    GH_REPO: OrderlyNetwork/cli
  script:
    - command -v unzip >/dev/null || (apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends unzip)
    - |
      set -euo pipefail
      tag="${PLATFORM_TAG:-${CI_COMMIT_TAG:-}}"
      test -n "$tag" || { echo "set PLATFORM_TAG (for example v2.1.2)"; exit 1; }
      base="https://github.com/${GH_REPO}/releases/download/${tag}"
      mkdir -p binaries
      for target in $(node scripts/npm-platforms.mjs --print-targets); do
        mkdir -p "binaries/${target}"
        case "$target" in
          *windows*)
            curl -fsSL --retry 60 --retry-delay 15 --retry-all-errors \
              -o /tmp/orderly.zip "${base}/orderly-${target}.zip"
            unzip -j -o /tmp/orderly.zip orderly.exe -d "binaries/${target}"
            ;;
          *)
            curl -fsSL --retry 60 --retry-delay 15 --retry-all-errors \
              -o /tmp/orderly.tar.gz "${base}/orderly-${target}.tar.gz"
            tar -xzf /tmp/orderly.tar.gz -C "binaries/${target}" orderly
            ;;
        esac
      done
      find binaries -type f | sort
      node scripts/npm-platforms.mjs --binaries binaries --out npm-platforms \
        --version "${tag#v}" --verify-host
    - |
      set -euo pipefail
      test -n "${PUBLIC_NPM_TOKEN:-}" || { echo "PUBLIC_NPM_TOKEN is not set"; exit 1; }
      registry="${PUBLIC_NPM_REGISTRY:-https://registry.npmjs.org/}"
      publish() {
        dir="$1"
        name=$(node -p "require('./${dir}/package.json').name")
        version=$(node -p "require('./${dir}/package.json').version")
        if npm view "${name}@${version}" version --registry "${registry}" >/dev/null 2>&1; then
          echo "${name}@${version} already published, skipping"
          return 0
        fi
        ( cd "${dir}" && NODE_AUTH_TOKEN="${PUBLIC_NPM_TOKEN}" npm publish --access public --registry "${registry}" )
        echo "published ${name}@${version}"
      }
      # Platform packages first: the launcher's optionalDependencies must exist
      # before anyone installs it.
      for dir in npm-platforms/@orderly.network/cli-*; do publish "$dir"; done
      publish npm-platforms/@orderly.network/cli
  tags:
    - dev
    - build
